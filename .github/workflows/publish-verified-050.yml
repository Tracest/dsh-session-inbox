name: Publish verified 0.5.0
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/publish-verified-050.yml]
permissions:
  contents: write
concurrency:
  group: publish-verified-050
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a07c7108dcd25a4dfba00dda80c1dc2fac099561
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate tagged source
        run: npm run check
      - name: Verify package contents, upload assets, and publish existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, tarfile, urllib.request
          bundle = json.loads(r'''{"manifest":{"LICENSE":{"sha256":"2d7307b32ed4d746fcb7eb4ebe80c1dfba6af548579adc1529352c3bc5cc3c05","mode":"crlf","filemode":420},"vendor/LICENSE.deepseek":{"sha256":"e5b182b2fccc24c632788ed1e86a45e7a927d801bdf11c1b6b2a831854678826","mode":"crlf","filemode":420},"assets/backup-preview.jpg":{"sha256":"073b563bd58abead7f644815b01bded114794842b35d1713690ba2357f55f6da","mode":"unchanged","filemode":420},"assets/native-menu.jpg":{"sha256":"4abeeb311ae6ec7fc00fe458a10cb1f3c3a9a551e830073849556ad89035e773","mode":"unchanged","filemode":420},"assets/original-layout.jpg":{"sha256":"0ccf48b42e4590c7f078d26e3716dab1d51023f359ae496c276ada133b564c2d","mode":"unchanged","filemode":420},"assets/search-results.jpg":{"sha256":"4b2ea28909e69aec0cdeab7778daabe549641337c16820f7a1de16e8f966bddc","mode":"unchanged","filemode":420},"assets/sidebar.jpg":{"sha256":"66432f36f2ab5787546cfbc01782e2dfd198dbb8c9caffe49491c812fc50c1f4","mode":"unchanged","filemode":420},"assets/working-bottom.jpg":{"sha256":"e8349f3cf99ba5c99d886610839946d6529109e8f76fb913847c615dbaf3ad74","mode":"unchanged","filemode":420},"lib/client.js":{"sha256":"d0e34b222ee4240b1e5f57bc9c10c9708b93eb9e4df7e3fa04626a24236608fd","mode":"unchanged","filemode":420},"lib/index.js":{"sha256":"40ea9bdead3361cc638022f42cc622f8a15700effc991ae365c0973ffca3aa9c","mode":"unchanged","filemode":420},"lib/build-info.json":{"sha256":"274991d4f9ee2da0ab530e2a91ea4288bec7a0e9daf01256c2154f8df4fb847a","mode":"unchanged","filemode":420},"compatibility.json":{"sha256":"216e4a446308654e6ba03d43378cbe9a7a4c36531a724a0fb49c2fe8c8aa5976","mode":"crlf","filemode":420},"locale/en.json":{"sha256":"165cb3e48e0a68821b0ab1f19536da12248a6d3250e9179ead6ba7f6ea1f5191","mode":"crlf","filemode":420},"package.json":{"sha256":"5ae60b3675af47e0d6f71b5e28be5e45ac1f370e1c1dc92033dfee0b3f585660","mode":"crlf","filemode":420},"lib/runtime-template.json":{"sha256":"da069499dc3d34fdb69498d05251b23e5e817467c7e77da8a84d5375461f89ed","mode":"unchanged","filemode":420},"locale/zh.json":{"sha256":"f6b313be0569026e04ef7929938c9b5aa49fc7b872736f9d53941bc6104bcc6e","mode":"crlf","filemode":420},"README.md":{"sha256":"0e1e3ad0618e8401e895812aedf8af2861de658f4bc1651283ab84541bf5ce32","mode":"crlf","filemode":420},"README.zh-CN.md":{"sha256":"e0002f74d25e9e6cf41df4aa1c19ebb71abbfe4947641dee99ec8f91227cb1db","mode":"crlf","filemode":420},"THIRD_PARTY_NOTICES.md":{"sha256":"b279ee0ac2a03d3d84b5e54b4b1d24a4d4cb7c211283ff87d9ff5fd7fb987f1f","mode":"crlf","filemode":420},"lib/adapter.mjs":{"sha256":"dbb41c0b16a39320dac6ddeac74dd607b2915b87cef818f1d0e41e8bf1bb9ed7","mode":"unchanged","filemode":420},"assets/icon.svg":{"sha256":"9aacf7727ee6cad5199fb84f11454731bd9e448015807ca84eae827630796153","mode":"crlf","filemode":420},"cordis.patch.yml":{"sha256":"db130928fbf47636e625e5d547df3eeefd9bdded77e7f986d8b9a3f22474c60d","mode":"crlf","filemode":420}},"notes":"DSH 会话工作台 0.5.0\n\n本版改为检测当前 DSH 的界面接口并增强原生会话列表，减少 DSH 更新后逐版适配的需要。\n\n主要更新\n\n- 不再在运行时使用十六份固定版本的旧工作区代码；改为读取当前宿主模块并在内存中增强，保留原生服务、依赖、菜单和样式。\n- 检测到接入点、模块内容、所需接口或渲染不兼容时，保留或恢复当前 DSH 的原生列表；停用插件也会恢复原生界面。\n- 保留圆角单色图标、勾选整理功能和底部浮动撤销。撤销提示停留五秒，鼠标悬停或键盘聚焦时暂停计时。\n- 增加 GitHub 兼容性检查，可手动指定新发布的 DSH 版本执行回归。\n\n兼容范围\n\n- DSH 0.1.7-rc.1 起，至 1.0.0 预发布版之前。\n- 排除已确认存在原生故障的 0.2.2-alpha.2。\n- 版本范围包含预发布版；准入范围不代表所有未来版本都已实测。重大界面重构仍可能需要维护，1.0 需要重新评估。\n\n验证结果\n\n- 85 项 JavaScript 测试与 6 项安装器测试通过。\n- 保留 16 组已发布原生模块作为构建和回归样本。\n- DSH 0.1.7-rc.1、0.2.1-rc.5、0.2.2-rc.1 在 Windows 和 Linux 隔离 Web 环境中，各通过 15 项浏览器检查，共 90 项。\n- 覆盖菜单、搜索、整理/撤销、提示计时、刷新后状态保留、备份恢复、原布局切换、停用恢复，以及宿主模块变化时的回退。\n- 本地 Windows DSH 0.2.2-rc.1 已确认加载 0.5.0，原有聊天历史保留，其他插件版本未变。\n\n证据边界：浏览器检查使用空测试会话，仅在工作台呈现夹具中视作非空，未调用模型 API。Linux 检查为无界面浏览器中的 Web 运行时，不等同于 Linux 桌面版验收。本版未重新验收 macOS、手机、真实模型轮次和任意第三方插件组合。\n\n安装与更新\n\n附件 dsh-session-inbox-0.5.0.tgz 为标准插件安装包。推荐通过 DSH 插件管理的 Git 来源安装；命令行安装到桌面配置可使用：\n\ndsh plugin --profile desktop add git+https://github.com/Tracest/dsh-session-inbox.git#v0.5.0\n\nWeb 用户将 desktop 换为 web。安装后在任务空闲时正常退出并重新打开 DSH。\n\n插件只保存整理与显示偏好，不删除、归档或改写聊天历史。整理标记保存在当前来源的 localStorage；需要迁移或清理站点数据时，可先从列表设置导出整理备份。\n\n版本提交：a07c7108dcd25a4dfba00dda80c1dc2fac099561\n安装包 SHA-256：fa7ddc966e917ebe6a886224bcb36345c0e1fbcbb6b45a9655c53d509b2f5d3b\n","verification":{"plugin":"0.5.0","engineRange":">=0.1.7-rc.1 <0.2.2-alpha.2 || >0.2.2-alpha.2 <1.0.0-0","excludedVersions":["0.2.2-alpha.2"],"strategy":"Enhance the actual current native factory; retain native UI on detected incompatibility","regressionFixtures":["0.1.7-rc.1","0.1.7-rc.2","0.2.0-rc.1","0.2.0-rc.2","0.2.1-alpha.1","0.2.1-alpha.2","0.2.1-alpha.3","0.2.1-alpha.4","0.2.1-alpha.5","0.2.1-rc.1","0.2.1-rc.2","0.2.1-rc.3","0.2.1-rc.4","0.2.1-rc.5","0.2.2-alpha.3","0.2.2-rc.1"],"tests":{"javascript":85,"installer":6,"windowsBrowserChecks":45,"linuxBrowserChecks":45,"totalBrowserChecks":90},"browserRuns":[{"version":"0.1.7-rc.1","plugin":"0.5.0","platform":"win32","browser":"156.0.4314.58","scope":"Real isolated official DSH Web runtime and headless Chromium browser; empty fixture sessions presented as nonblank in the workbench only; no model API calls","checks":["current native module enhanced and workbench mounted","native create, rename and metadata refresh","native shell aliases and rounded icons","native session menu: button","native session menu: right click","native session menu: Shift+F10","search and clear","floating undo, no layout shift, hover and focus pauses","keyboard settle and timed dismissal","settled state survives reload and restores","backup export and merge preview","original layout round trip at both viewport sizes","no browser errors or workbench fallback","effect disposal restores native list and CSS; reactivation restores workbench","changed native factory falls back to the current native list without browser errors"],"primitiveTypes":{"Menu":"function","HoverCard":"function","HoverCardGroup":"undefined","Modal":"function","Button":"function"},"changedNativeAssets":1,"passed":true,"browserErrors":[],"consoleErrors":[]},{"version":"0.2.1-rc.5","plugin":"0.5.0","platform":"win32","browser":"156.0.4314.58","scope":"Real isolated official DSH Web runtime and headless Chromium browser; empty fixture sessions presented as nonblank in the workbench only; no model API calls","checks":["current native module enhanced and workbench mounted","native create, rename and metadata refresh","native shell aliases and rounded icons","native session menu: button","native session menu: right click","native session menu: Shift+F10","search and clear","floating undo, no layout shift, hover and focus pauses","keyboard settle and timed dismissal","settled state survives reload and restores","backup export and merge preview","original layout round trip at both viewport sizes","no browser errors or workbench fallback","effect disposal restores native list and CSS; reactivation restores workbench","changed native factory falls back to the current native list without browser errors"],"primitiveTypes":{"Menu":"function","HoverCard":"function","HoverCardGroup":"function","Modal":"function","Button":"object"},"changedNativeAssets":1,"passed":true,"browserErrors":[],"consoleErrors":[]},{"version":"0.2.2-rc.1","plugin":"0.5.0","platform":"win32","browser":"156.0.4314.58","scope":"Real isolated official DSH Web runtime and headless Chromium browser; empty fixture sessions presented as nonblank in the workbench only; no model API calls","checks":["current native module enhanced and workbench mounted","native create, rename and metadata refresh","native shell aliases and rounded icons","native session menu: button","native session menu: right click","native session menu: Shift+F10","search and clear","floating undo, no layout shift, hover and focus pauses","keyboard settle and timed dismissal","settled state survives reload and restores","backup export and merge preview","original layout round trip at both viewport sizes","no browser errors or workbench fallback","effect disposal restores native list and CSS; reactivation restores workbench","changed native factory falls back to the current native list without browser errors"],"primitiveTypes":{"Menu":"function","HoverCard":"function","HoverCardGroup":"function","Modal":"function","Button":"object"},"changedNativeAssets":1,"passed":true,"browserErrors":[],"consoleErrors":[]}],"package":{"file":"dsh-session-inbox-0.5.0.tgz","bytes":1129877,"sha256":"fa7ddc966e917ebe6a886224bcb36345c0e1fbcbb6b45a9655c53d509b2f5d3b"},"boundaries":["Future version labels are simulations, not actual unreleased runtimes","Web checks use empty fixture sessions presented as nonblank in the workbench; no model API calls","Linux verification is headless Web, not a Linux Desktop application acceptance","macOS, mobile, real model turns and arbitrary third-party combinations were not revalidated in this release"],"linuxBrowserRuns":[{"version":"0.1.7-rc.1","plugin":"0.5.0","platform":"linux","browser":"156.0.8078.4","scope":"Real isolated official DSH Web runtime and headless Chromium browser; empty fixture sessions presented as nonblank in the workbench only; no model API calls","checks":["current native module enhanced and workbench mounted","native create, rename and metadata refresh","native shell aliases and rounded icons","native session menu: button","native session menu: right click","native session menu: Shift+F10","search and clear","floating undo, no layout shift, hover and focus pauses","keyboard settle and timed dismissal","settled state survives reload and restores","backup export and merge preview","original layout round trip at both viewport sizes","no browser errors or workbench fallback","effect disposal restores native list and CSS; reactivation restores workbench","changed native factory falls back to the current native list without browser errors"],"primitiveTypes":{"Menu":"function","HoverCard":"function","HoverCardGroup":"undefined","Modal":"function","Button":"function"},"changedNativeAssets":1,"passed":true,"browserErrors":[],"consoleErrors":[]},{"version":"0.2.1-rc.5","plugin":"0.5.0","platform":"linux","browser":"156.0.8078.4","scope":"Real isolated official DSH Web runtime and headless Chromium browser; empty fixture sessions presented as nonblank in the workbench only; no model API calls","checks":["current native module enhanced and workbench mounted","native create, rename and metadata refresh","native shell aliases and rounded icons","native session menu: button","native session menu: right click","native session menu: Shift+F10","search and clear","floating undo, no layout shift, hover and focus pauses","keyboard settle and timed dismissal","settled state survives reload and restores","backup export and merge preview","original layout round trip at both viewport sizes","no browser errors or workbench fallback","effect disposal restores native list and CSS; reactivation restores workbench","changed native factory falls back to the current native list without browser errors"],"primitiveTypes":{"Menu":"function","HoverCard":"function","HoverCardGroup":"function","Modal":"function","Button":"object"},"changedNativeAssets":1,"passed":true,"browserErrors":[],"consoleErrors":[]},{"version":"0.2.2-rc.1","plugin":"0.5.0","platform":"linux","browser":"156.0.8078.4","scope":"Real isolated official DSH Web runtime and headless Chromium browser; empty fixture sessions presented as nonblank in the workbench only; no model API calls","checks":["current native module enhanced and workbench mounted","native create, rename and metadata refresh","native shell aliases and rounded icons","native session menu: button","native session menu: right click","native session menu: Shift+F10","search and clear","floating undo, no layout shift, hover and focus pauses","keyboard settle and timed dismissal","settled state survives reload and restores","backup export and merge preview","original layout round trip at both viewport sizes","no browser errors or workbench fallback","effect disposal restores native list and CSS; reactivation restores workbench","changed native factory falls back to the current native list without browser errors"],"primitiveTypes":{"Menu":"function","HoverCard":"function","HoverCardGroup":"function","Modal":"function","Button":"object"},"changedNativeAssets":1,"passed":true,"browserErrors":[],"consoleErrors":[]}],"desktopRuntime":{"version":"0.2.2-rc.1","ui":{"host":{"version":"0.2.2-rc.1","mode":"adaptive"},"enabled":true,"plugin":"0.5.0","rows":4,"icons":12,"mode":"inbox","fallback":false}},"localData":{"pluginVersion":"0.5.0","pluginSource":"github:Tracest/dsh-session-inbox#72b50e26009fdc6483a20a24982826761dba5011","sessionFilesChecked":389,"changedSessionFiles":2,"missingSessionFiles":0,"otherPluginChanges":[],"historyPreserved":true,"unchangedFileHashes":387,"nativeEndSeedAppends":2,"validation":"passed"},"publication":{"sourceCommit":"72b50e26009fdc6483a20a24982826761dba5011","mainCommit":"a07c7108dcd25a4dfba00dda80c1dc2fac099561","checks":[{"url":"https://github.com/Tracest/dsh-session-inbox/actions/runs/42170528583","result":"success"},{"url":"https://github.com/Tracest/dsh-session-inbox/actions/runs/42170528569","result":"success"}]},"verifiedAt":"2026-11-06T05:57:37.615150+00:00"},"evidence":""}''')
          expected_commit = 'a07c7108dcd25a4dfba00dda80c1dc2fac099561'
          repo = 'Tracest/dsh-session-inbox'
          release_id = 436193150
          tag = 'v0.5.0'
          def api(method, path, data=None, upload=None):
              host = 'https://uploads.github.com' if upload is not None else 'https://api.github.com'
              headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
              if upload is not None:
                  payload = upload
                  headers['Content-Type'] = 'application/octet-stream'
              else:
                  payload = None if data is None else json.dumps(data).encode()
                  headers['Content-Type'] = 'application/json'
              request = urllib.request.Request(host + path, data=payload, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)
          ref = api('GET', '/repos/' + repo + '/git/ref/tags/' + tag)
          assert ref['object']['type'] == 'commit' and ref['object']['sha'] == expected_commit
          release = api('GET', '/repos/' + repo + '/releases/' + str(release_id))
          assert release['tag_name'] == tag and release['draft'] and not release['prerelease']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == expected_commit
          assert json.loads(pathlib.Path('package.json').read_text())['version'] == '0.5.0'
          for name, info in bundle['manifest'].items():
              path = pathlib.Path(name)
              data = path.read_bytes()
              if info['mode'] != 'unchanged':
                  data = data.replace(b'\r\n', b'\n')
                  if info['mode'] == 'crlf':
                      data = data.replace(b'\n', b'\r\n')
              assert hashlib.sha256(data).hexdigest() == info['sha256'], name
              path.write_bytes(data)
              path.chmod(info['filemode'])
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release-050'
          out.mkdir(exist_ok=True)
          result = json.loads(subprocess.check_output(['npm', 'pack', '--ignore-scripts', '--json', '--pack-destination', str(out)], text=True))
          package = out / result[0]['filename']
          with tarfile.open(package) as archive:
              entries = archive.getmembers()
              assert len(entries) == len(bundle['manifest']) and all(x.isfile() for x in entries)
              seen = set()
              for entry in entries:
                  assert entry.name.startswith('package/')
                  name = entry.name[len('package/'):]
                  assert name not in seen
                  seen.add(name)
                  assert hashlib.sha256(archive.extractfile(entry).read()).hexdigest() == bundle['manifest'][name]['sha256'], name
              assert seen == set(bundle['manifest'])
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          old_digest = bundle['verification']['package']['sha256']
          notes = bundle['notes'].replace(old_digest, digest)
          if digest != old_digest:
              notes += '\n发布包由 GitHub Actions 从上述固定提交重新打包；包内 22 个文件逐字节匹配本地已验收安装包，归档压缩字节可能不同。\n'
          (out / 'release-notes-0.5.0.txt').write_text(notes, encoding='utf-8')
          verification = bundle['verification']
          verification['originalVerifiedPackage'] = verification['package']
          verification['package'] = {'file': package.name, 'bytes': package.stat().st_size, 'sha256': digest}
          verification['releasePackaging'] = {'commit': expected_commit, 'exactFileMatches': len(seen), 'run': 'https://github.com/' + repo + '/actions/runs/' + os.environ['GITHUB_RUN_ID']}
          (out / 'verification-0.5.0.json').write_text(json.dumps(verification, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (out / 'compatibility-0.5.0-evidence.zip').write_bytes(base64.b64decode(bundle['evidence']))
          files = sorted(out.iterdir())
          checksums = ''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in files)
          (out / 'SHA256SUMS-0.5.0.txt').write_text(checksums, encoding='utf-8')
          files = sorted(out.iterdir())
          expected = {p.name: 'sha256:' + hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
          assets = {a['name']: a for a in release['assets']}
          assert set(assets).issubset(expected), 'Unexpected existing release assets'
          for path in files:
              if path.name in assets:
                  asset = assets[path.name]
              else:
                  asset = api('POST', '/repos/' + repo + '/releases/' + str(release_id) + '/assets?name=' + path.name, upload=path.read_bytes())
              assert asset['state'] == 'uploaded' and asset['size'] == path.stat().st_size
              assert asset['digest'] == expected[path.name], path.name
          verified = api('GET', '/repos/' + repo + '/releases/' + str(release_id))
          assert {a['name']: a['digest'] for a in verified['assets']} == expected
          published = api('PATCH', '/repos/' + repo + '/releases/' + str(release_id), {'body': notes, 'draft': False, 'make_latest': 'true'})
          assert not published['draft'] and published['tag_name'] == tag and published['published_at']
          print(json.dumps({'url': published['html_url'], 'sha256': digest, 'filesVerified': len(seen), 'assets': list(expected)}, indent=2))
          
